spring.application.name=app

spring.datasource.url=jdbc:mysql://localhost:3306/civicfix?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

admin.username=${ADMIN_USERNAME}
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=uploads/reports

# Invio email (recupero password) via SMTP Gmail.
# MAIL_PASSWORD deve essere una "password per le app" a 16 cifre generata su
# https://myaccount.google.com/apppasswords - la password normale dell'account
# viene rifiutata da Gmail. Se MAIL_USERNAME non e' impostata l'invio viene
# saltato e il link di recupero resta comunque leggibile nei log del backend.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Mittente mostrato nell'email; per Gmail deve coincidere con MAIL_USERNAME.
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# Base usata per costruire il link di recupero inviato all'utente.
app.frontend-url=${FRONTEND_URL:http://localhost:4200}