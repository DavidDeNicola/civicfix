server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Le foto possono arrivare a 5 MB: il default di Nginx (1 MB) le bloccherebbe
    client_max_body_size 10M;

    # Chiamate all'API → container del backend
    location /api/ {
        proxy_pass http://civicfix-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Foto delle segnalazioni → servite dal backend
    location /uploads/ {
        proxy_pass http://civicfix-backend:8080;
    }

    # Tutto il resto → app Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}