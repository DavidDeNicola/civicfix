<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Illustrazione di uno skyline urbano con lavori pubblici in corso">

  <!-- Distant skyline: lightest layer -->
  <g fill="#64748b" opacity="0.10">
    <rect x="20"   y="250" width="90"  height="250"/>
    <rect x="130"  y="300" width="70"  height="200"/>
    <rect x="215"  y="210" width="105" height="290"/>
    <rect x="340"  y="285" width="80"  height="215"/>
    <rect x="440"  y="235" width="95"  height="265"/>
    <rect x="555"  y="310" width="75"  height="190"/>
    <rect x="650"  y="200" width="110" height="300"/>
    <rect x="780"  y="270" width="85"  height="230"/>
    <rect x="885"  y="225" width="100" height="275"/>
    <rect x="1005" y="295" width="78"  height="205"/>
    <rect x="1100" y="240" width="105" height="260"/>
    <rect x="1225" y="285" width="82"  height="215"/>
    <rect x="1330" y="215" width="98"  height="285"/>
    <rect x="1450" y="290" width="88"  height="210"/>
    <!-- Spires -->
    <rect x="255"  y="160" width="12"  height="60"/>
    <rect x="695"  y="150" width="12"  height="60"/>
    <rect x="1370" y="165" width="12"  height="60"/>
  </g>

  <!-- Mid layer: buildings with lit windows -->
  <g fill="#64748b" opacity="0.16">
    <rect x="90"   y="330" width="120" height="170"/>
    <rect x="300"  y="355" width="140" height="145"/>
    <rect x="600"  y="340" width="130" height="160"/>
    <rect x="900"  y="360" width="125" height="140"/>
    <rect x="1180" y="335" width="135" height="165"/>
    <rect x="1420" y="365" width="120" height="135"/>
  </g>

  <!-- Window grid on the mid-layer blocks -->
  <g fill="#64748b" opacity="0.30">
    <g>
      <rect x="108" y="350" width="14" height="18"/><rect x="132" y="350" width="14" height="18"/><rect x="156" y="350" width="14" height="18"/><rect x="180" y="350" width="14" height="18"/>
      <rect x="108" y="384" width="14" height="18"/><rect x="156" y="384" width="14" height="18"/><rect x="180" y="384" width="14" height="18"/>
      <rect x="108" y="418" width="14" height="18"/><rect x="132" y="418" width="14" height="18"/><rect x="180" y="418" width="14" height="18"/>
    </g>
    <g>
      <rect x="318" y="375" width="14" height="18"/><rect x="342" y="375" width="14" height="18"/><rect x="390" y="375" width="14" height="18"/><rect x="414" y="375" width="14" height="18"/>
      <rect x="318" y="409" width="14" height="18"/><rect x="366" y="409" width="14" height="18"/><rect x="414" y="409" width="14" height="18"/>
    </g>
    <g>
      <rect x="618" y="360" width="14" height="18"/><rect x="642" y="360" width="14" height="18"/><rect x="690" y="360" width="14" height="18"/>
      <rect x="618" y="394" width="14" height="18"/><rect x="666" y="394" width="14" height="18"/><rect x="690" y="394" width="14" height="18"/>
      <rect x="642" y="428" width="14" height="18"/><rect x="690" y="428" width="14" height="18"/>
    </g>
    <g>
      <rect x="918" y="380" width="14" height="18"/><rect x="966" y="380" width="14" height="18"/><rect x="990" y="380" width="14" height="18"/>
      <rect x="918" y="414" width="14" height="18"/><rect x="942" y="414" width="14" height="18"/><rect x="990" y="414" width="14" height="18"/>
    </g>
    <g>
      <rect x="1198" y="355" width="14" height="18"/><rect x="1222" y="355" width="14" height="18"/><rect x="1270" y="355" width="14" height="18"/>
      <rect x="1198" y="389" width="14" height="18"/><rect x="1246" y="389" width="14" height="18"/><rect x="1270" y="389" width="14" height="18"/>
      <rect x="1222" y="423" width="14" height="18"/><rect x="1270" y="423" width="14" height="18"/>
    </g>
    <g>
      <rect x="1438" y="385" width="14" height="18"/><rect x="1462" y="385" width="14" height="18"/><rect x="1510" y="385" width="14" height="18"/>
      <rect x="1438" y="419" width="14" height="18"/><rect x="1486" y="419" width="14" height="18"/>
    </g>
  </g>

  <!-- Public works: tower crane over the city -->
  <g stroke="#64748b" fill="none" opacity="0.26" stroke-width="5" stroke-linecap="round">
    <!-- mast -->
    <path d="M765 460 L765 175"/>
    <path d="M752 460 L752 175"/>
    <path d="M752 205 L765 235 M765 205 L752 235 M752 265 L765 295 M765 265 L752 295 M752 325 L765 355 M765 325 L752 355 M752 385 L765 415 M765 385 L752 415"/>
    <!-- jib -->
    <path d="M660 175 L900 175"/>
    <path d="M700 158 L830 158"/>
    <path d="M700 158 L672 175 M740 158 L724 175 M790 158 L776 175 M830 158 L828 175"/>
    <!-- counterweight + hoist line -->
    <rect x="655" y="168" width="26" height="18" fill="#64748b" stroke="none"/>
    <path d="M855 175 L855 245"/>
  </g>
  <!-- crane hook load -->
  <rect x="836" y="245" width="38" height="24" rx="3" fill="#64748b" opacity="0.26"/>

  <!-- Public works: road barrier + cones at street level -->
  <g opacity="0.30">
    <!-- barrier -->
    <rect x="1055" y="452" width="150" height="14" rx="3" fill="#64748b"/>
    <rect x="1063" y="466" width="10" height="34" fill="#64748b"/>
    <rect x="1187" y="466" width="10" height="34" fill="#64748b"/>
    <!-- cones -->
    <path d="M1240 500 L1256 456 L1272 500 Z" fill="#64748b"/>
    <path d="M1300 500 L1316 466 L1332 500 Z" fill="#64748b"/>
  </g>

  <!-- Street line -->
  <rect x="0" y="496" width="1600" height="4" fill="#64748b" opacity="0.22"/>
</svg>
