    <mat-sidenav mode="side" opened class="sidebar">
      <app-navbar></app-navbar>
    </mat-sidenav>
    <mat-sidenav-content class="content-area">
      <router-outlet></router-outlet>

  </mat-sidenav-container>
} @else {
  <router-outlet></router-outlet>
}
