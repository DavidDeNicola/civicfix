<div class="register-container">
  <mat-card class="register-card">
    <mat-card-header>
      <mat-card-title>Crea un account</mat-card-title>
    </mat-card-header>

    <mat-card-content>

      @if (errore) {
        <p class="error-message">{{ errore }}</p>
      }

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username</mat-label>
        <input matInput [(ngModel)]="username" autocomplete="username">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" [(ngModel)]="email" autocomplete="email">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nome completo</mat-label>
        <input matInput [(ngModel)]="fullName" autocomplete="name">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" [(ngModel)]="password" autocomplete="new-password">
      </mat-form-field>

      <button mat-flat-button color="primary" class="full-width"
              (click)="register()" [disabled]="loading">
        {{ loading ? 'Registrazione in corso...' : 'Registrati' }}
      </button>

      <p class="register-link">
        Hai già un account? <a routerLink="/login">Accedi</a>
      </p>

    </mat-card-content>
  </mat-card>
</div>
