<div class="report-card" [ngClass]="'accent-' + report.category.toLowerCase()" [routerLink]="['/reports', report.id]">
  <div class="category-icon" [ngClass]="'cat-' + report.category.toLowerCase()">{{ icona }}</div>

  <div class="card-main">
    <div class="card-title-row">
      <h3>{{ report.title }}</h3>
      <span class="priority-badge" [ngClass]="'priority-' + report.priority.toLowerCase()">{{ report.priority }}</span>
    </div>
    <span class="address">📍 {{ report.address }}</span>
    <p class="description">{{ report.description }}</p>
    <div class="card-footer">
      <span class="status-badge" [ngClass]="'status-' + report.status.toLowerCase()">{{ report.status }}</span>
      <span class="date">{{ report.createdAt | date:'dd/MM/yyyy' }}</span>
    </div>
  </div>

  <div class="mini-map" #miniMap></div>
</div>
